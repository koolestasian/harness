services:
  omnigent:
    image: agent-workbench-server:0.19.1
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD: ${OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD:?Run deploy/bootstrap.py first}
      OMNIGENT_ACCOUNTS_COOKIE_SECRET: ${OMNIGENT_ACCOUNTS_COOKIE_SECRET:?Run deploy/bootstrap.py first}
      OMNIGENT_ACCOUNTS_BASE_URL: ${OMNIGENT_ACCOUNTS_BASE_URL:-http://localhost:6767}
      OMNIGENT_WS_ALLOWED_ORIGINS: ${OMNIGENT_WS_ALLOWED_ORIGINS:-http://localhost:6767}
    ports:
      - "127.0.0.1:6767:6767"
    volumes:
      - omnigent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6767/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
volumes:
  omnigent-data:
